<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="baidu-site-verification" content="codeva-weHwyzdXR0" />
    <link rel="icon" type="image/png" href="/zhiyin-logo.png" />
    <link rel="apple-touch-icon" href="/zhiyin-logo.png" />
    <meta
      name="description"
      content="知音 — 自由连接 Music Provider 的独立网页音乐播放器。"
    />
    <title>知音</title>
    <script>
      try {
        const storedTheme = localStorage.getItem('zy.music.theme');
        document.documentElement.dataset.theme = ['light', 'dark', 'glass'].includes(storedTheme) ? storedTheme : 'dark';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
