<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="baidu-site-verification" content="codeva-weHwyzdXR0" />
    <link rel="icon" type="image/png" href="/zhiyin-logo.png" />
    <link rel="apple-touch-icon" href="/zhiyin-touch-icon.png" />
    <meta
      name="description"
      content="知音 — 自由连接 Music Provider 的独立网页音乐播放器。"
    />
    <meta name="theme-color" content="#0f1013" />
    <title>知音</title>
    <script>
      // Visitors without a saved choice follow the system light or dark preference.
      let initialTheme = 'dark';
      try {
        const storedTheme = localStorage.getItem('zy.music.theme');
        initialTheme = ['light', 'dark', 'glass'].includes(storedTheme) ? storedTheme : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch { /* Keep the dark default when storage is unavailable. */ }
      document.documentElement.dataset.theme = initialTheme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
